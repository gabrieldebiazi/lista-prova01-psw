<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card de Produto</title>
    <link rel="stylesheet" href="exercicio7.css">
</head>

<body>
    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsktwaMyCoD9g1Y-5tJHhDyu3G_YrpSNUxb0u9COZ8NVYNa32Mj8A_DZi-&s=10"
            alt="Imagem do Produto" class="produto-imagem">
        <div class="card-body">
            <h2 class="produto-nome">Notebook Gamer Acer Nitro</h2>
            <p class="produto-descricao">Especificações do produto: Intel Core I5, NVIDIA GTX 1650, 16GB RAM, 512GB SSD</p>
            <p class="produto-preco">R$ 4999,99</p>
            <button class="botao-comprar">Comprar</button>
        </div>
    </div>
</body>

</html>
